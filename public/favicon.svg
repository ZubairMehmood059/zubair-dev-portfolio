<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D20"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#646973"/>
      <stop offset="50%" stop-color="#D7E2EA"/>
      <stop offset="100%" stop-color="#BBCCD7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BBCCD7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7E2EA" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#646973" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D7E2EA" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle 3D Grid Accent -->
  <path d="M12 24H52M12 40H52" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M24 12V52M40 12V52" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Stylized Geometric Z Emblem -->
  <!-- Top bar -->
  <path d="M17 18H47L43 25H17V18Z" fill="url(#accentGrad)" filter="url(#softGlow)"/>
  
  <!-- Diagonal faceted stroke -->
  <path d="M43 23L23 41H31L47 25V23H43Z" fill="url(#metalGrad)"/>
  <path d="M40 25L21 42H28L44 26L40 25Z" fill="#FFFFFF" fill-opacity="0.4"/>
  
  <!-- Bottom bar -->
  <path d="M17 39L21 46H47V39H17Z" fill="url(#accentGrad)" filter="url(#softGlow)"/>

  <!-- .dev Node Dot -->
  <circle cx="49" cy="46" r="3" fill="#D7E2EA" stroke="#0C0C0C" stroke-width="1.5"/>
</svg>
